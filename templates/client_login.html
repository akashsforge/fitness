{% extends "base.html" %}

{% block title %}Client Login — Training Log{% endblock %}

{% block body %}
<div class="auth-wrap">
  <p class="eyebrow">Training Log</p>
  <h1>Client login</h1>
  <p class="auth-sub">Sign in to see your lanes.</p>

  <div class="card">
    <form method="post" action="/login">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="btn-primary">Log in</button>
    </form>
  </div>

  <p class="auth-switch">New here? <a href="/client-signup">Create an account</a></p>
  <p class="auth-switch">Logging in as a coach? <a href="/coach-login">Coach login</a></p>
</div>
{% endblock %}
