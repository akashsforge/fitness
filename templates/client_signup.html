{% extends "base.html" %}

{% block title %}Client Signup — Training Log{% endblock %}

{% block body %}
<div class="auth-wrap">
  <p class="eyebrow">Training Log</p>
  <h1>Join as a client</h1>
  <p class="auth-sub">Create an account and link up with your coach.</p>

  <div class="card">
    <form method="post" action="/client-signup">
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <div class="field">
        <label for="coach_id">Your coach</label>
        <select id="coach_id" name="coach_id" required>
          <option value="" disabled selected>Choose your coach</option>
          {% for coach in coaches %}
            <option value="{{ coach.id }}">{{ coach.name }}</option>
          {% endfor %}
        </select>
      </div>
      <button type="submit" class="btn-primary">Create account</button>
    </form>
  </div>

  <p class="auth-switch">Already have an account? <a href="/client-login">Log in</a></p>
</div>
{% endblock %}
