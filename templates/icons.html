{% macro lane_icon(ttype) %}
{% if ttype == "running" %}
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="14.5" cy="4.5" r="1.6" fill="currentColor" stroke="none"/>
  <path d="M11 8l2 2.5 3 1.3-1 3.2M13 10.5l-3 2-3.5 1M10 12.5l1.2 3.8L8.5 20M11.2 16.3L14 18l3.5-.7"/>
</svg>
{% elif ttype == "walking" %}
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <ellipse cx="8.2" cy="6.5" rx="1.3" ry="1.8" transform="rotate(-18 8.2 6.5)"/>
  <ellipse cx="15.6" cy="13.5" rx="1.3" ry="1.8" transform="rotate(-18 15.6 13.5)"/>
  <path d="M8.2 8.6v3M15.6 15.6v3" stroke-opacity="0.55"/>
</svg>
{% elif ttype == "pushup" %}
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <rect x="2.5" y="10" width="3" height="4" rx="1"/>
  <rect x="18.5" y="10" width="3" height="4" rx="1"/>
  <path d="M5.5 12h13"/>
  <rect x="4.5" y="9" width="1.5" height="6" rx="0.5" fill="currentColor" stroke="none"/>
  <rect x="18" y="9" width="1.5" height="6" rx="0.5" fill="currentColor" stroke="none"/>
</svg>
{% elif ttype == "jump" %}
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="5" r="1.6" fill="currentColor" stroke="none"/>
  <path d="M8 9l4 3 4-3M12 12v4M9.5 20l2.5-4 2.5 4"/>
  <path d="M3.5 15.5c2-3.5 5-5.5 8.5-5.5s6.5 2 8.5 5.5" stroke-opacity="0.55"/>
</svg>
{% else %}
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="12" r="7.5"/>
  <circle cx="12" cy="12" r="3.8"/>
  <circle cx="12" cy="12" r="0.9" fill="currentColor" stroke="none"/>
</svg>
{% endif %}
{% endmacro %}
