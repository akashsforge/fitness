{% extends "base.html" %}

{% block title %}Coach Signup — Training Log{% endblock %}

{% block body %}
<div class="auth-wrap">
  <p class="eyebrow">Training Log</p>
  <h1>Become a coach</h1>
  <p class="auth-sub">Create an account to start assigning tasks.</p>

  <div class="card">
    <form method="post" action="/signup">
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="btn-primary">Create account</button>
    </form>
  </div>

  <p class="auth-switch">Already have an account? <a href="/coach-login">Log in</a></p>
</div>
{% endblock %}
